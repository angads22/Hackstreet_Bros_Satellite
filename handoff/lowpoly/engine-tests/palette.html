<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LowPoly palette</title>
<style>
  body { margin: 0; padding: 14px; background: #14181f; color: #cfd6df; font: 12px/1.3 system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; } p { margin: 0 0 12px; color: #8a97a8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .sw { background: #1b212b; border-radius: 6px; padding: 6px; }
  .sw canvas { display: block; width: 100%; height: 86px; border-radius: 4px; }
  .sw b { display: block; margin-top: 5px; font-size: 12px; } .sw span { color: #8a97a8; font-size: 11px; }
  h2 { font-size: 13px; margin: 18px 0 8px; color: #9fb0c3; }
  .strip { width: 100%; max-width: 940px; height: 380px; display: block; border-radius: 6px; }
</style>
<script src="../../js/lowpoly.js"></script>
</head>
<body>
<h1>LowPoly palette, 39 names</h1>
<p>Each swatch: the flat colour on the left half, the same colour on a lit cube (default light) on the right half. Emissive names are drawn with e:1.</p>
<div class="grid" id="grid"></div>
<h2>Hardware, terrain and people together under the default light (a cohesion check)</h2>
<canvas id="strip" class="strip"></canvas>
<script>
var L = LowPoly, grid = document.getElementById('grid');
function hsl(hex) {
  var r = parseInt(hex.substr(1, 2), 16) / 255, g = parseInt(hex.substr(3, 2), 16) / 255, b = parseInt(hex.substr(5, 2), 16) / 255;
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
  if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  return { h: h, s: s, l: l };
}
window.PALETTE_STATS = [];
Object.keys(L.palette).forEach(function (name) {
  var d = document.createElement('div'); d.className = 'sw';
  var c = document.createElement('canvas'); d.appendChild(c);
  var emissive = name === 'glow' || name === 'glowCool';
  var hex = L.colorOf(name), q = hsl(hex);
  var b = document.createElement('b'); b.textContent = name + (emissive ? ' (emissive)' : ''); d.appendChild(b);
  var sp = document.createElement('span'); sp.textContent = hex + '  h' + Math.round(q.h) + ' s' + Math.round(q.s * 100) + ' l' + Math.round(q.l * 100); d.appendChild(sp);
  grid.appendChild(d);
  var cube = L.box(1, 1, 1, name); if (emissive) cube = L.emit(cube);
  // left half: flat colour via a big emissive quad; right half: lit cube
  var flat = L.emit(L.quad([-1.2, -0.6, 0], [0, -0.6, 0], [0, 0.6, 0], [-1.2, 0.6, 0], name));
  L.render(c, { items: [{ mesh: flat }, { mesh: cube, pos: [0.55, 0, 0.1], rot: [0, 0, 0] }], camera: { yaw: 25, pitch: 20, ortho: true, size: 1.7, dist: 8, target: [0, 0, 0] }, background: { color: name === 'space' ? 'black' : 'space' } });
  window.PALETTE_STATS.push({ name: name, hex: hex, h: q.h, s: q.s, l: q.l });
});
(function () {
  var items = [];
  function add(m, x, y, z, ry) { items.push({ mesh: m, pos: [x, y, z], rot: [0, ry || 0, 0] }); }
  add(L.box(14, 0.2, 5, 'ground'), 0, -0.1, 0);
  add(L.box(6, 0.12, 3, 'concrete'), -3, 0.06, 0.4);
  add(L.box(14, 0.02, 1.6, 'grass'), 0, 0.01, -2);
  add(L.cylinder(0.5, 0.5, 2.2, 8, 'white'), -5, 1.1, 0.4); add(L.cone(0.5, 0.7, 8, 'red'), -5, 2.55, 0.4);
  add(L.box(0.9, 0.9, 0.9, 'silver'), -3.4, 0.6, 0.4); add(L.box(1.8, 0.04, 0.8, 'cell'), -2.3, 0.7, 0.4); add(L.box(1.8, 0.05, 0.06, 'cellEdge'), -2.3, 0.7, 0.4);
  add(L.cylinder(0.4, 0.4, 0.5, 8, 'gold'), -3.4, 1.25, 0.4); add(L.cylinder(0.15, 0.15, 0.1, 8, 'copper'), -3.4, 1.55, 0.4);
  add(L.box(0.6, 0.6, 0.6, 'graphite'), -1.2, 0.4, 0.4); add(L.box(0.6, 0.6, 0.6, 'metalDark'), -0.5, 0.4, 0.4); add(L.box(0.6, 0.6, 0.6, 'steel'), 0.2, 0.4, 0.4); add(L.box(0.6, 0.6, 0.6, 'black'), 0.9, 0.4, 0.4);
  add(L.box(0.3, 0.3, 0.3, 'orange'), 2, 0.25, 0.4); add(L.box(0.3, 0.3, 0.3, 'yellow'), 2.4, 0.25, 0.4); add(L.box(0.3, 0.3, 0.3, 'teal'), 2.8, 0.25, 0.4); add(L.box(0.3, 0.3, 0.3, 'green'), 3.2, 0.25, 0.4);
  add(L.emit(L.box(0.2, 0.2, 0.2, 'glow')), 3.8, 0.2, 0.4); add(L.emit(L.box(0.2, 0.2, 0.2, 'glowCool')), 4.2, 0.2, 0.4);
  add(L.sphere(0.9, 2, 'sea'), 5.6, 1.0, -1.2); add(L.sphere(0.5, 1, 'land'), 5.2, 0.5, 0.8); add(L.sphere(0.35, 1, 'sand'), 6.0, 0.35, 0.6); add(L.sphere(0.35, 1, 'ice'), 6.5, 0.35, 0.9); add(L.sphere(0.3, 1, 'cloud'), 6.3, 1.4, -0.2);
  [['skin1', 'hair1', 'shirt1'], ['skin2', 'hair2', 'shirt2'], ['skin3', 'hair3', 'shirt3']].forEach(function (p, i) {
    var x = 1.2 + i * 0.8;
    add(L.box(0.4, 0.5, 0.25, p[2]), x, 1.15, -1.0); add(L.sphere(0.16, 1, p[0]), x, 1.6, -1.0); add(L.box(0.2, 0.1, 0.26, p[1]), x, 1.72, -1.0);
    if (i === 0) add(L.box(0.06, 0.28, 0.02, 'tie'), x, 1.2, -0.87);
  });
  L.render(document.getElementById('strip'), { items: items, camera: { yaw: 12, pitch: 12, dist: 15, target: [0.6, 0.8, 0], fov: 32 }, background: { color: 'sky' }, label: 'palette in use' });
})();
</script>
</body>
</html>
