<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LowPoly builders from several angles</title>
<style>
  body { margin: 0; padding: 12px; background: #14181f; color: #cfd6df; font: 12px/1.3 system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .row b { width: 150px; flex: none; font-weight: 600; }
  canvas { width: 110px; height: 110px; display: block; border-radius: 3px; }
</style>
<script src="../../js/lowpoly.js"></script>
</head>
<body>
<div id="host"></div>
<script>
var L = LowPoly;
var ANGLES = [[0, 0], [60, 25], [130, -30], [200, 35], [270, -20], [330, 75], [20, -75]];
function ringPoly(n, r) { var p = []; for (var i = 0; i < n; i++) p.push([r * Math.cos(i * 2 * Math.PI / n), r * Math.sin(i * 2 * Math.PI / n)]); return p; }
var BUILT = [
  ['box', L.box(1, 1.4, 0.8, 'steel'), true],
  ['cylinder', L.cylinder(0.4, 0.4, 1.2, 8, 'steel'), true],
  ['cylinder frustum', L.cylinder(0.25, 0.55, 1.2, 7, 'steel'), true],
  ['cylinder no top cap', L.cylinder(0.45, 0.45, 1, 9, 'steel', { capTop: false }), false],
  ['cone', L.cone(0.55, 1.2, 8, 'steel'), true],
  ['sphere 0', L.sphere(0.7, 0, 'steel'), true],
  ['sphere 1', L.sphere(0.7, 1, 'steel'), true],
  ['sphere 2', L.sphere(0.7, 2, 'steel'), true],
  ['sphere 3', L.sphere(0.7, 3, 'steel'), true],
  ['prism hexagon', L.prism(ringPoly(6, 0.6), 0.8, 'steel'), true],
  ['prism concave L', L.prism([[-0.6, -0.6], [0.6, -0.6], [0.6, 0], [0, 0], [0, 0.6], [-0.6, 0.6]], 0.6, 'steel'), true],
  ['prism wedge (cw input)', L.prism([[-0.6, 0.4], [0.6, 0.4], [0, -0.5]], 0.5, 'steel'), true],
  ['torus', L.torus(0.6, 0.18, 14, 7, 'steel'), true],
  ['lathe bell', L.lathe([[0.15, -0.6], [0.2, -0.2], [0.55, 0.6]], 10, 'steel', true), false],
  ['lathe closed vase', L.lathe([[0, -0.6], [0.4, -0.5], [0.5, 0], [0.25, 0.4], [0.2, 0.6], [0, 0.6]], 10, 'steel'), true],
  ['quad (single side)', L.quad([-0.6, -0.5, 0], [0.6, -0.5, 0], [0.6, 0.5, 0], [-0.6, 0.5, 0], 'copper'), false],
  ['quad double-sided', L.quad([-0.6, -0.5, 0], [0.6, -0.5, 0], [0.6, 0.5, 0], [-0.6, 0.5, 0], 'copper', true), false],
  ['disc', L.disc(0.7, 10, 'copper'), false],
  ['disc double-sided', L.disc(0.7, 10, 'copper', true), false],
  ['jittered sphere', L.jitter(L.sphere(0.7, 2, 'steel'), 0.06, 3), true],
  ['jittered box', L.jitter(L.box(1, 1, 1, 'steel'), 0.07, 3), true],
  ['mirrored cone (x)', L.mirror(L.move(L.cone(0.4, 1, 6, 'steel'), 0.5, 0, 0), 'x'), true],
  ['rotated box', L.rotate(L.box(1, 0.4, 0.4, 'steel'), 20, 40, 60), true],
  ['place: rod to (1,1,0)', L.merge([L.sphere(0.12, 1, 'red'), L.place(L.move(L.cylinder(0.05, 0.05, 1, 6, 'steel'), 0, 0.5, 0), { normal: [1, 1, 0] }), L.place(L.move(L.cylinder(0.05, 0.05, 1, 6, 'teal'), 0, 0.5, 0), { normal: [0, -1, 0] }), L.place(L.move(L.cylinder(0.05, 0.05, 1, 6, 'gold'), 0, 0.5, 0), { normal: [0, 0, 1] })]), false],
  ['emissive box', L.merge([L.box(0.8, 0.8, 0.8, 'steel'), L.move(L.emit(L.box(0.3, 0.3, 0.3, 'glow')), 0, 0.55, 0)]), true]
];
var host = document.getElementById('host');
BUILT.forEach(function (b) {
  var row = document.createElement('div'); row.className = 'row';
  var name = document.createElement('b'); name.textContent = b[0] + ' (' + L.count(b[1]) + ')'; row.appendChild(name);
  host.appendChild(row);
  ANGLES.forEach(function (a) {
    var c = document.createElement('canvas'); row.appendChild(c);
    L.render(c, { items: [{ mesh: b[1] }], camera: { yaw: a[0], pitch: a[1], fov: 35 }, background: { color: 'space' }, label: b[0] });
  });
});
</script>
</body>
</html>
