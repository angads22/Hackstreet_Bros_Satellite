<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GRAVITRON: The Gravitronical Odyssey</title>
  <!-- Pixel fonts from Google Fonts (SIL Open Font License). The game falls back to Courier New offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=VT323&display=swap">
  <!-- Part 1 (1958) type: a typewriter and a stencil (SIL Open Font License). Missing, it falls back to Courier New. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&family=Stardos+Stencil:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=1.0">
  <link rel="stylesheet" href="css/story.css?v=1.0">
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="brand-top">
          <span class="brand-name">GRAVITRON</span>
          <!-- LIVE DATA or SNAPSHOT: which data the game is using (getLiveData). Filled in by js/ui-design.js. -->
          <span class="data-badge" id="data-badge" role="status" hidden></span>
        </div>
        <span class="brand-status" id="status">Space Mission Design Game</span>
      </div>
      <p class="objective" id="objective" aria-live="polite" hidden></p>
      <button type="button" class="minimap" id="minimap" aria-label="MAP [M]: open the base map" hidden></button>
      <button type="button" class="icon-btn" id="help-btn" aria-label="Hint for this screen" aria-expanded="false" hidden>?</button>
    </header>

    <p class="hint" id="hint" role="complementary" aria-label="Hint" hidden></p>

    <main id="app" tabindex="-1"></main>

    <!-- The one place the game shows its version. See "Versions and changelog" in SPEC.md. -->
    <footer class="foot">GRAVITRON v1.0</footer>
  </div>

  <!-- Data: one global per file -->
  <script src="data/parts.js?v=1.0"></script>
  <script src="data/launchers.js?v=1.0"></script>
  <script src="data/orbits.js?v=1.0"></script>
  <script src="data/objectives.js?v=1.0"></script>
  <script src="data/campaign.js?v=1.0"></script>
  <script src="data/contracts.js?v=1.0"></script>
  <script src="data/research.js?v=1.0"></script>
  <script src="data/tiers.js?v=1.0"></script>
  <script src="data/events.js?v=1.0"></script>
  <script src="data/debrief.js?v=1.0"></script>
  <script src="data/missions.js?v=1.0"></script>
  <script src="data/hints.js?v=1.0"></script>
  <script src="data/eras.js?v=1.0"></script>
  <script src="data/earth.js?v=1.0"></script>

  <!-- Back end -->
  <script src="js/game.js?v=1.0"></script>
  <script src="js/mission.js?v=1.0"></script>
  <script src="js/live-data.js?v=1.0"></script>

  <!-- Low-poly art (the front end draws with it when it is there, and works without it) -->
  <script src="js/lowpoly.js?v=1.0"></script>
  <script src="js/lp-earth.js?v=1.0"></script>
  <script src="js/lp-parts-body.js?v=1.0"></script>
  <script src="js/lp-parts-instruments.js?v=1.0"></script>
  <script src="js/lp-parts-systems.js?v=1.0"></script>
  <script src="js/lp-satellite.js?v=1.0"></script>
  <script src="js/lp-pad.js?v=1.0"></script>
  <script src="js/lp-people.js?v=1.0"></script>
  <script src="js/lp-base.js?v=1.0"></script>

  <!-- Front end -->
  <script src="js/motion.js?v=1.0"></script>

  <script src="js/part-story.js?v=1.0"></script>
  <script src="js/ui-parts.js?v=1.0"></script>
  <script src="js/ui-design.js?v=1.0"></script>
  <script src="js/ui-mission.js?v=1.0"></script>
  <script src="js/ui-tree.js?v=1.0"></script>
  <script src="js/ui-campaign.js?v=1.0"></script>
  <script src="js/ui-comeback.js?v=1.0"></script>
  <script src="js/ui-story.js?v=1.0"></script>
  <script src="js/ui-ending.js?v=1.0"></script>
</body>
</html>
